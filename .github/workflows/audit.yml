# 사이트 전수 검사(AGENTS.md "검사와 배포"). 교수가 요청할 때만 Actions 에서 수동으로 돌린다. 배포를 막지 않는다.
name: audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - name: Build, run every check and capture every screen
        run: node tools/visual_review.js prepare --out visual-review-bundle --implementer full-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-audit-${{ github.run_id }}
          path: visual-review-bundle/
          retention-days: 14
