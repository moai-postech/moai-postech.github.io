{% include text-selection.html %}
<script>
// Tabs for [data-tabs]: the first tab is open; clicking or arrow keys switch panels.
document.querySelectorAll('[data-tabs]').forEach(function (box) {
  var tabs = Array.prototype.slice.call(box.querySelectorAll('[role="tab"]'));
  function show(tab) {
    tabs.forEach(function (t) {
      var on = t === tab;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { show(t); });
    t.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      var index = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : d ? (i + d + tabs.length) % tabs.length : -1;
      if (index >= 0) { e.preventDefault(); var n = tabs[index]; show(n); n.focus(); }
    });
  });
  show(tabs.filter(function (t) { return t.getAttribute('aria-selected') === 'true'; })[0] || tabs[0]);
});
// Home focus rings: the chosen ring opens into its card. The beam's two edges are the tangents from the card's near corners
// to the ring, and its inner end follows the ring's own outline, so ring, beam and card read as one shape.
// Side by side the beam opens to the right; stacked (narrow screens) it opens downward.
document.querySelectorAll('.focus-explorer').forEach(function (box) {
  var rings = box.querySelector('.focus-rings'), link = box.querySelector('.focus-link'), card = box.querySelector('.focus-panels');
  if (!rings || !link || !card) return;
  var beam = link.querySelector('.beam'), grad = link.querySelector('linearGradient'), TAU = Math.PI * 2;
  function mod(v) { return ((v % TAU) + TAU) % TAU; }
  function draw() {
    var g = box.querySelector('.focus-ring[aria-selected="true"]');
    if (!g || !rings.getBoundingClientRect().width) return;
    var b = box.getBoundingClientRect(), r = rings.getBoundingClientRect(), p = card.getBoundingClientRect(), s = r.width / 400;
    rings.style.setProperty('--ring-k', (1 / s).toFixed(4));  // ring names keep a type-scale size in pixels (theme.css)
    var R = +g.getAttribute('data-r') * s, cx = r.left - b.left + 200 * s, cy = r.top - b.top + 200 * s;
    var k = parseFloat(getComputedStyle(card).borderTopLeftRadius) || 0, down = p.top - b.top >= cy;
    // the two card corners the beam lands on, just inside the rounded corner (the card covers the rest)
    // c1 then c2 run clockwise as seen from the ring: top then bottom corner, or right then left corner when stacked
    var c1 = down ? [p.right - b.left, p.top - b.top + k] : [p.left - b.left + k, p.top - b.top];
    var c2 = down ? [p.left - b.left, p.top - b.top + k] : [p.left - b.left + k, p.bottom - b.top];
    function tangent(c, sign) {  // the tangent point on the outer side of the beam
      var a = Math.atan2(c[1] - cy, c[0] - cx), d = Math.sqrt(Math.pow(c[0] - cx, 2) + Math.pow(c[1] - cy, 2));
      return a + sign * Math.acos(Math.min(1, R / d));
    }
    var a1 = tangent(c1, -1), a2 = tangent(c2, 1);
    var span = mod(a2 - a1), f = function (v) { return v.toFixed(1); };
    var t1 = [cx + R * Math.cos(a1), cy + R * Math.sin(a1)], t2 = [cx + R * Math.cos(a2), cy + R * Math.sin(a2)];
    link.setAttribute('viewBox', '0 0 ' + b.width + ' ' + b.height);
    grad.setAttribute('x1', f(down ? 0 : cx + R)); grad.setAttribute('y1', f(down ? cy + R : 0));
    grad.setAttribute('x2', f(down ? 0 : c1[0])); grad.setAttribute('y2', f(down ? c1[1] : 0));
    beam.setAttribute('d', 'M' + f(t1[0]) + ' ' + f(t1[1]) + 'L' + f(c1[0]) + ' ' + f(c1[1]) + 'L' + f(c2[0]) + ' ' + f(c2[1]) + 'L' + f(t2[0]) + ' ' + f(t2[1])
      + 'A' + f(R) + ' ' + f(R) + ' 0 ' + (span > Math.PI ? 1 : 0) + ' 0 ' + f(t1[0]) + ' ' + f(t1[1]) + 'Z');
  }
  new MutationObserver(draw).observe(rings, { subtree: true, attributeFilter: ['aria-selected'] });
  if (window.ResizeObserver) new ResizeObserver(draw).observe(box);
  window.addEventListener('resize', draw);
  if (document.fonts) document.fonts.ready.then(draw);
  draw();
});
// Talks dated after today read as upcoming (checked in the visitor's browser, so it never goes stale between builds).
(function () {
  var d = new Date(), today = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  document.querySelectorAll('tr[data-date]').forEach(function (r) { if (r.getAttribute('data-date') >= today) r.classList.add('is-upcoming'); });
})();
// Talks: All | Research | Education buttons show list items by data-kind; a year heading hides when nothing under it is shown.
document.querySelectorAll('[data-talk-filter]').forEach(function (box) {
  var btns = Array.prototype.slice.call(box.querySelectorAll('[data-show]'));
  function apply(kind) {
    box.querySelectorAll('li[data-kind]').forEach(function (li) { li.hidden = kind !== 'all' && li.getAttribute('data-kind') !== kind; });
    box.querySelectorAll('[data-year-head]').forEach(function (h) {
      var list = h.nextElementSibling, any = list && list.querySelector('li[data-kind]:not([hidden])');
      h.hidden = !any; if (list) list.hidden = !any;
    });
    var more = box.querySelector('details'); if (more) more.hidden = !more.querySelector('li[data-kind]:not([hidden])');
    btns.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-show') === kind ? 'true' : 'false'); });
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { apply(b.getAttribute('data-show')); }); });
  apply('all');
});
// Filters for [data-filter]: year tabs ([data-year] buttons) pick one year, buttons with data-show pick rows by data-kind within it.
// The year rows are only for pages without scripts; the tabs name the year, so they hide here. The kind counts follow the chosen year.
// Column widths are measured with every row shown and then fixed, so switching years or filters never moves a column.
document.querySelectorAll('[data-filter]').forEach(function (box) {
  var btns = Array.prototype.slice.call(box.querySelectorAll('[data-show]'));
  var years = Array.prototype.slice.call(box.querySelectorAll('[role="tab"][data-year]'));
  var rows = Array.prototype.slice.call(box.querySelectorAll('tbody tr'));
  var talks = rows.filter(function (r) { return r.hasAttribute('data-kind'); });
  var table = box.querySelector('table');
  var cols = Array.prototype.slice.call(box.querySelectorAll('col'));
  var year = years.length ? years.filter(function (b) { return b.getAttribute('aria-selected') === 'true'; })[0].getAttribute('data-year') : null;
  var kind = 'all', locked = false;
  function apply() {
    var head = null, any = false;
    rows.forEach(function (r) {
      if (!r.hasAttribute('data-kind')) { if (head) head.hidden = year !== null || !any; head = r; any = false; return; }
      r.hidden = (year !== null && r.getAttribute('data-year') !== year) || (kind !== 'all' && r.getAttribute('data-kind') !== kind);
      if (!r.hidden) any = true;
    });
    if (head) head.hidden = year !== null || !any;
    btns.forEach(function (b) {
      var k = b.getAttribute('data-show'), n = talks.filter(function (r) { return (year === null || r.getAttribute('data-year') === year) && (k === 'all' || r.getAttribute('data-kind') === k); }).length;
      b.querySelector('span').textContent = n;
    });
  }
  function lock() {
    table.classList.remove('is-locked');
    cols.forEach(function (c) { c.style.width = ''; });
    if (getComputedStyle(table).display !== 'table') return;  /* phones stack the cells; nothing to fix */
    var hidden = rows.filter(function (r) { return r.hidden; });
    hidden.forEach(function (r) { r.hidden = false; });
    var row = talks.filter(function (r) { return r.children.length === cols.length; })[0] || talks[0];  /* every row has the same three cells (date, title with its affiliation, speaker) */
    var widths = Array.prototype.map.call(row.children, function (td) { return td.getBoundingClientRect().width; });
    hidden.forEach(function (r) { r.hidden = true; });
    cols.forEach(function (c, i) { if (i !== 1) c.style.width = widths[i] + 'px'; });  /* the title column takes the rest */
    table.classList.add('is-locked');
  }
  apply();
  lock();
  if (document.fonts) document.fonts.ready.then(lock);
  var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(lock, 150); });
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      kind = b.getAttribute('data-show');
      btns.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      apply();
    });
  });
  function pick(b) {
    year = b.getAttribute('data-year');
    years.forEach(function (x) { var on = x === b; x.setAttribute('aria-selected', on ? 'true' : 'false'); x.tabIndex = on ? 0 : -1; });
    apply();
  }
  years.forEach(function (b, i) {
    b.addEventListener('click', function () { pick(b); });
    b.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      var index = e.key === 'Home' ? 0 : e.key === 'End' ? years.length - 1 : d ? (i + d + years.length) % years.length : -1;
      if (index >= 0) { e.preventDefault(); pick(years[index]); years[index].focus(); }
    });
  });
});
</script>
<script>
// Home Paper Stella band: the band keeps the clicks for its own link, so it tells the embedded map where
// the pointer is. The map uses this to open a short TL;DR beside the name under the pointer.
// Embedded maps: a click lifts the cover so the map takes the wheel and drags; leaving it or clicking outside covers it again.
document.querySelectorAll('.embed').forEach(function (box) {
  var shield = box.querySelector('.embed-shield'), frame = box.querySelector('iframe');
  if (!shield) return;
  function cover() { box.classList.remove('is-active'); }
  shield.addEventListener('click', function () { box.classList.add('is-active'); frame.focus({ preventScroll: true }); });
  box.addEventListener('mouseleave', cover);
  document.addEventListener('pointerdown', function (e) { if (!box.contains(e.target)) cover(); });
});
document.querySelectorAll('.has-mini').forEach(function (band) {
  var frame = band.querySelector('.mini-preview iframe');
  if (!frame) return;
  // With a poster the map loads only once this page has finished loading and is idle, so the two do not
  // compete for the processor and the map's first turns run smoothly; the poster covers the wait.
  if (frame.dataset.src) {
    var start = function () {
      var go = function () { frame.src = frame.dataset.src; };
      if (window.requestIdleCallback) requestIdleCallback(go, { timeout: 1500 }); else setTimeout(go, 200);
    };
    if (document.readyState === 'complete') start(); else window.addEventListener('load', start);
  }
  function send(e) {
    if (!frame.contentWindow) return;
    var r = frame.getBoundingClientRect();
    frame.contentWindow.postMessage(e
      ? { type: 'stella-mini-pointer', x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }
      : { type: 'stella-mini-pointer', x: null, y: null }, '*');
  }
  band.addEventListener('pointermove', send);
  band.addEventListener('pointerleave', function () { send(null); });
  // The band shows its own still poster until the map inside says it is drawing.
  window.addEventListener('message', function (e) {
    if (e.source === frame.contentWindow && e.data && e.data.type === 'stella-mini-ready') {
      frame.closest('.mini-preview').classList.add('is-ready');
    }
  });
});
</script>
