# 학기별 학습 흐름과 운영 정보. learning_path 의 start·end 는 그 단계에 속한 회차 번호로 Schedule 에서 단계에 마우스를 올리면 그 행을 강조한다. tldr 은 학기 주제를 한 문장으로 줄인 요약으로 Home 학기 카드와 Schedule 학기 탭이 함께 쓴다. tldr 은 learning_path 단계마다 구절 하나를 단계 순서대로 두고, 각 구절은 그 단계 제목의 첫 단어를 쓴다(제목은 동사구나 테마가 드러나는 명사구, text 는 마크다운이라 **굵게** 가능). 단계 범위는 1회부터 마지막 번호 회차까지 빈틈·겹침 없이 잇는다. Optional 딱지가 붙은 번호 회차(Summer 2026 10회)도 넣고, A1 같은 선택 주제는 넣지 않는다(교수 2026-11-03). 검사: node tools/check_study_terms.js(교수 2026-11-02). icon 은 Home 학기 카드의 그림(학기 주제별 study-*.svg, Codex 제작 2026-11-02). 일정·자료는 ai_study.yml(시트 자동 동기화), 운영 정보는 이 파일에서 관리한다.
# 시간 근거와 장소 변경 결정은 changelog/2026-10-28-ai-study-materials.md에 있다.
# 장소 기본값: Fall 2026부터 공학4동 302호. 특별한 이슈가 없으면 새 학기도 302호를 사용한다(교수 2026-10-28).
fall-2026:
  cohort: "3"
  tldr: "How robots learn to do what humans do with arms and legs, and foundation models help them perceive and plan."
  icon: "assets/img/icons/physical.svg"
  learning_path:
    - { start: 1, end: 6, title: "Robot Embodiment", text: "How robot tasks mirror **human abilities**: arms that grasp, legs that walk, a sense of where to go, and humanoid bodies with dexterous hands, all learned from data." }
    - { start: 7, end: 11, title: "Foundation Models for Robotics", text: "How **foundation models** help robots act: an understanding of 3D space, vision and language turned into action, and world models that bring perception and planning." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Tuesdays", time: "21:00 – 22:00 KST" }
  location: { building: "Science Building 4", rooms: "Room 302" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
summer-2026:
  cohort: "2.5"  # 여름 학기는 정규 학기 사이의 추가 기수라 2.5기(교수 2026-11-03)
  tldr: "How architectures are trained, representation and generation model data, and generalization explains why they work on new data."
  icon: "assets/img/icons/study-deep-learning.svg"
  format: lectures
  reference_course: { title: "MIT 6.7960 Deep Learning", term: "Fall 2025", url: "https://deeplearning6-7960.github.io/2025/index.html" }
  learning_path:
    - { start: 1, end: 3, title: "Architectures and Training", text: "How deep networks are built and trained: backpropagation first, then **architectures** designed for their data, from CNNs to Transformers." }
    - { start: 4, end: 7, title: "Representation and Generation", text: "How networks model data: they **encode** it into representations and **decode** them into new samples." }
    - { start: 8, end: 10, title: "Generalization and Theory", text: "How models **generalize** beyond the training data: to shifted distributions and new tasks, and why this works at all." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Tuesdays", time: "15:30 – 16:30 KST" }
  location: { building: "Science Building 4", rooms: "Room 307" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
spring-2026:
  cohort: "2"
  tldr: "How LLMs are trained through pretraining and post-training, and from there they grow into agents that reason and act."
  icon: "assets/img/icons/study-llm.svg"
  reference_course: { lead: "See also", title: "Princeton COS 597R Deep Dive into Large Language Models", term: "Fall 2024", url: "https://princeton-cos597r.github.io/" }  # 참고 강의일 뿐 그대로 따르지 않아 "See also"(교수 2026-11-03). Summer 2026 처럼 그대로 따른 강의는 lead 없이 "Based on"
  learning_path:
    - { start: 1, end: 5, title: "Training LLMs", text: "How an LLM is trained: **pretraining** and prompting first, then **post-training** that aligns it with what people want." }
    - { start: 6, end: 9, title: "From LLMs to Agents", text: "How an LLM grows into an agent: **reasoning** over many steps, **memory** beyond a single context, then acting in a loop with tools." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Tuesdays", time: "21:00 – 22:30 KST" }
  location: { building: "Science Building 4", rooms: "Room 307" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
fall-2025:
  cohort: "1"
  tldr: "How models build perception of images and text, generation lets them create images and videos, and multimodal LLMs unify both."
  icon: "assets/img/icons/study-foundation-models.svg"
  learning_path:
    - { start: 1, end: 5, title: "Perception", text: "How models **understand** what they see and read: the basics of networks and Transformers, then seeing images and linking them with text." }
    - { start: 6, end: 7, title: "Generation", text: "How models **create** new content: generating images, then videos, from a text prompt." }
    - { start: 8, end: 9, title: "Multimodal LLMs", text: "How one model brings the two together: scaled-up LLMs, then multimodal LLMs that **unify** perception and generation." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Wednesdays", time: "22:00 – 23:00 KST" }
  location: { building: "Science Building 4", rooms: "Room 307" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
