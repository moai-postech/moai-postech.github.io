# 사이트 전체 설정. 콘텐츠는 _data/ 와 페이지 *.md, 모양은 _themes/<테마>/ 에 있다.

title: MOAI Lab
# 글자형 MOAI 모아이. 머리글·꼬리말·강의 바닥에서 원래 비율로 쓴다.
logo: assets/img/logo-moai.svg
# POSTECH 정보기술팀이 학교 도메인(moai.postech.ac.kr) 연결 조건으로 요구한 요소(2026-09-15 권장사항). 지우지 않는다.
# 머리글 좌상단 워드마크, 꼬리말 로고, 강의 페이지 바닥이 같이 쓴다. 링크는 영어판(교수 2026-10-23),
# 개인정보 링크 이름은 영어판 본부 꼬리말의 공식 명칭 그대로
postech:
  url: https://www.postech.ac.kr/eng/index.do
  wordmark: assets/img/postech-wordmark-hd.png
  logo: assets/img/postech-logo.png
  privacy_label: Personal Information Policy
  privacy_url: https://www.postech.ac.kr/eng/usage-guide/privacy_policy.do
# 꼬리말(전 페이지): 연구실 홈, 학과, 주소. 모양은 테마의 includes/footer.html
footer:
  department: Department of Industrial and Management Engineering
  department_url: https://ime.postech.ac.kr/
  address: 77 Cheongam-ro, Nam-gu, Pohang, Gyeongbuk 37673, Korea
  office: Science Building 4, Room 319
  phone: +82-54-279-2202

# 위쪽 메뉴. url 은 페이지 파일 이름(.md → .html). children 이 있으면 마우스를 올렸을 때 하위 메뉴가 뜬다
nav:
  - title: Home
    url: index.html
  - title: People
    children:
      - title: Faculty
        url: faculty.html
      - title: Lab Members
        url: students.html
      - title: Other Mentees
        url: mentees.html
  - title: Research
    children:
      - title: Overview
        url: research.html
      - title: Seminar
        url: seminar.html
      - title: Funding
        url: funding.html
  - title: Publications
    children:
      - title: By Year
        url: publications.html
      - title: By Topic
        url: landscape.html
  - title: Teaching
    children:
      - title: Courses
        url: teaching.html
      - title: Talks
        url: talks.html
  - title: Contact
    url: contact.html

# 테마 선택. 테마를 바꾸려면 아래 두 줄의 "wide" 를 새 테마 폴더 이름으로 바꾼다(classic, editorial 은 참고용이라 그대로는 동작하지 않는다).
layouts_dir: _themes/wide/layouts
includes_dir: _themes/wide/includes

markdown: kramdown
kramdown:
  input: GFM
  # 따옴표를 곡선 따옴표로 바꾸지 않는다(원문 그대로)
  smart_quotes: ["apos", "apos", "quot", "quot"]

exclude:
  - AGENTS.md
  - POSTECH.md
  - CLAUDE.md
  - GEMINI.md
  - README.md
  - TODO.md
  - changelog
  - discussions
  - tools
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
