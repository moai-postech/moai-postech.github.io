    <section class="content-section">
    <h2>{{ include.section.title }}</h2>
    <div class="section-body">
    {% for y in site.data.talks %}
    <h3 class="sub">{{ y.year }}</h3>
    <ul class="plain item-list">
      {% for t in y.talks %}<li>
        <span class="item-main"><strong>{{ t.title }}</strong></span>
        <span class="item-side">{{ t.venues | join: " · " }}</span>
      </li>
      {% endfor %}
    </ul>
    {% endfor %}
    {% if include.section.more %}<p class="more">{% include inline.html text=include.section.more %}</p>{% endif %}
    </div>
    </section>
