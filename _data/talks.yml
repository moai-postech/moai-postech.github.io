# Teaching > Talks(talks.md). 발표 전체를 둔다(연구실 사이트는 개인 사이트로 링크하지 않는다).
# 위에서 두 묶음(올해, 작년)은 펼쳐 보이고 나머지는 "Earlier talks" 로 접는다(talks.md 절의 open).
# kind: education 은 Education 탭(본인 연구가 아닌 발표: 튜토리얼, 학과·교육 행사). 없으면 Research 탭(교수 2026-11-17).
# url 은 발표 자료(슬라이드)이고 제목이 그 링크가 된다. venues 의 기관은 이름만 쓰면 _data/institutions.yml 이 공식 사이트로 링크하고, 행사 이름으로 쓴 장소도 {name, url} 로 주최 기관 사이트를 단다. 행사 페이지는 쓰지 않는다(교수 2026-11-18: 가능하면 기관을 거는 것이 원칙). 장소는 부연 설명 없이 짧게(KSS Invited Talk). 내용은 개인 사이트 Talks 와 같게 맞춘다. 같은 발표의 장소가 여럿이면 venues 에 나열한다.
