# 26S 스케줄 시트(2026-10-22)와 1강 슬라이드(파트, 평가, 팀 프로젝트)에서 옮겼다. 시트의 개인 메모(다음 학기 개선점)는 넣지 않는다.
# 파트는 시트의 Outline 색: Software 3.0(2~6강), Software 1.0(7~14강), Software 2.0(15~22강). 가르친 순서대로 둔다.
title: "Programming for Data Science"
code: "IMEN574 / IDSC574"
term: "Spring 2026"
instructor:
  name: "Sangwoo Mo"
  url: "faculty.html"
summary: >-
  This course teaches programming for data science in the era of AI. We start by writing code with AI,
  then learn Python and classical machine learning, and end with deep learning and vision, language and multimodal models.
  In a team project, students take on a Kaggle competition and share what they learned.
links:
  - label: "Team project"
    url: "https://docs.google.com/spreadsheets/d/1ZHkM8KO2TC_gbfH7xdV5040B2zwJ0qd35VUnf0VvaCA/edit?usp=sharing"

parts:
  - id: "sw3"
    name: "Software 3.0"
    title: "Programming with AI"
    span: "Lectures 2 – 6"
    text: "Chat with LLMs, prompt them, and write code with AI in a modern IDE and with coding agents."
  - id: "sw1"
    name: "Software 1.0"
    title: "Python and Machine Learning"
    span: "Lectures 7 – 14"
    text: "Python, NumPy and pandas, then regression, classification, clustering, dimensionality reduction and interpretable ML."
  - id: "sw2"
    name: "Software 2.0"
    title: "Deep Learning"
    span: "Lectures 15 – 22"
    text: "Deep learning and PyTorch, vision and multimodal models, and AI for data science."

