# 강의 페이지 /teaching/26f-data-engineering/ 의 내용. 모양은 _themes/wide/includes/course/ 가 정한다(그 폴더의 README.md).
# 정본은 이 파일이다(2026-10-22부터 스케줄 구글시트를 대신한다). 슬라이드는 Drive lecture_note/ 의 배포본을 가리킨다.
title: "Data Engineering"
code: "IMEN891K / IDSC501 / AXGS-501"
term: "Fall 2026"
instructor:
  name: "Sangwoo Mo"
  url: "faculty.html"
office_hours: "Tuesdays 11:00 – 12:00, Room 319"
summary: >-
  This course covers the data side of AI systems: everything that happens before and after the model.
  We collect and prepare data, store and process it at scale, and then run models and agents on it.
  In a team project, students build a product on a real data pipeline from end to end.
# 세 파트. 스케줄의 part 줄과 이름이 같아야 한다.
parts:
  - id: "part-1"
    color: "blue"
    name: "Part I"
    title: "Collection and Preparation"
    span: "Lectures 2 – 5"
    text: "Collect data, explore it, and clean, integrate, transform and reduce it."
  - id: "part-2"
    color: "green"
    name: "Part II"
    title: "Storage"
    span: "Lectures 6 – 14"
    text: "Store and query it with SQL and NoSQL, then process it at scale in batches, warehouses and streams."
  - id: "part-3"
    color: "orange"
    name: "Part III"
    title: "Monitoring and Updates"
    span: "Lectures 15 – 18"
    text: "Run models and agents on the data: ML systems, LLM systems, RAG and agents."

# 한 줄 = 한 수업일. kind: lecture(번호 n), guest, seminar(학과 세미나), exam, project, break(휴강·온라인 수업일. off 는 YAML 이 false 로 읽어 쓰지 않는다), event.
# part 만 있는 줄은 파트 머리다. title 이 없으면 speaker 가 제목 자리에 온다. pdf·html·lab 은 공개 링크가 생기면 채운다(없으면 칸이 빈다).
