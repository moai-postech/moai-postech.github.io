{% for area in site.data.research %}
    <section class="content-section">
    <h2>{{ area.area }}</h2>
    <div class="section-body">
    <div class="card">
      {% for t in area.topics %}<div class="card-row">
        <h3>{{ t.name }}</h3>
        <div>
          <p>{% include inline.html text=t.summary %}</p>
          <p class="small muted">{% include inline.html text=t.papers %}</p>
        </div>
      </div>
      {% endfor %}
    </div>
    {% if area.note %}<p class="small muted section-note">{% include inline.html text=area.note %}</p>{% endif %}
    </div>
    </section>
{% endfor %}
