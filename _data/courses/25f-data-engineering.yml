# 팀 프로젝트 페이지. 25F 프로젝트 시트에는 팀원 이름이 없고 발표일 구분 없이 순서만 있다. 3팀 proposal 자료는 없다.
project:
  summary: >-
    Teams go through an end-to-end data engineering pipeline: they collect and prepare data, store it in a database,
    and build a product that addresses a real-world problem on it.
  team_size: "3 to 5 students"
  steps:
    - name: "Proposal"
      when: "Oct 14 & 16"
      text: "Ideation, data collection and preprocessing, and database management."
    - name: "Final"
      when: "Dec 9 & 11"
      text: "A product that addresses a real-world problem using a large-scale database, possibly with an LLM."
  criteria:
    - name: "Novelty"
      text: "Originality and creativity of the idea"
    - name: "Impact"
      text: "Relevance and potential usefulness of the solution"
    - name: "Technology"
      text: "Effective use of the techniques and tools covered in class"
    - name: "Presentation"
      text: "Clarity and professionalism of the report and presentation"
  rounds:
    - id: "proposal"
      name: "Proposal"
    - id: "final"
      name: "Final"
  teams:
    - n: 1
      title: "개인 맞춤 논문 요약 메일링"
