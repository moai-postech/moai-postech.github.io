# 학기별 Overview와 운영 정보. 일정·자료는 ai_study.yml(시트 자동 동기화), 운영 정보는 이 파일에서 관리한다.
# 시간 근거와 장소 변경 결정은 changelog/2026-10-28-ai-study-materials.md에 있다.
# 장소 기본값: Fall 2026부터 공학4동 302호. 특별한 이슈가 없으면 새 학기도 302호를 사용한다(교수 2026-10-28).
fall-2026:
  overview: "Start with how robots collect data and learn to move, then connect these capabilities to spatial understanding and foundation models."
  learning_path:
    - { label: "Topics 1–6", start: 1, end: 6, title: "Robot learning", text: "Collect demonstrations and learn manipulation, locomotion, navigation, and dexterous control." }
    - { label: "Topics 7–8", start: 7, end: 8, title: "3D understanding", text: "Represent and reconstruct the 3D world around a robot." }
    - { label: "Topics 9–11", start: 9, end: 11, title: "Foundation models for robotics", text: "Bring spatial reasoning, VLA, and world models together with robotic action." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Tuesdays", time: "21:00 – 22:00 KST" }
  location: { building: "Engineering Building 4", rooms: "Room 302" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
summer-2026:
  format: lectures
  reference_course: { title: "MIT 6.7960 Deep Learning", term: "Fall 2025", url: "https://deeplearning6-7960.github.io/2025/index.html" }
  overview: "Follow how neural networks learn, how their architectures and representations enable generation, and why they generalize to new tasks."
  learning_path:
    - { label: "Topics 1–3", start: 1, end: 3, title: "Training and architectures", text: "Start with optimization, then study architectures for grids and sequences." }
    - { label: "Topics 4–7", start: 4, end: 7, title: "Representation and generation", text: "Connect reconstruction and similarity-based learning to VAEs, GANs, diffusion, and flows." }
    - { label: "Topics 8–10", start: 8, end: 10, title: "Generalization and transfer", text: "Study generalization, transfer learning, and the theory behind deep learning." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Usually Tuesdays", time: "15:30 – 16:30 KST" }
  location: { building: "Engineering Building 4", rooms: "Room 307" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
spring-2026:
  overview: "Move from how LLMs reason to how they are trained and aligned, then extend them with context, retrieval, and tools."
  learning_path:
    - { label: "Topics 1–2", start: 1, end: 2, title: "LLMs and reasoning", text: "Review LLMs and chain-of-thought reasoning to frame what the model can do." }
    - { label: "Topics 3–6", start: 3, end: 6, title: "Training and alignment", text: "Connect supervised fine-tuning, RLHF, and RLAIF to reasoning models." }
    - { label: "Topics 7–9", start: 7, end: 9, title: "Context, retrieval, and agents", text: "Use long context, retrieval, and agents to work with external information and tools." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Tuesdays", time: "21:00 – 22:30 KST" }
  location: { building: "Engineering Building 4", rooms: "Room 307" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
fall-2025:
  overview: "Trace the path from deep learning and transformers to multimodal understanding, visual generation, and scaled language models."
  learning_path:
    - { label: "Topics 1–3", start: 1, end: 3, title: "Deep learning and vision", text: "Start with deep learning and transformers, then apply them to visual perception." }
    - { label: "Topics 4–5", start: 4, end: 5, title: "Multimodal understanding", text: "Study multimodal perception and visual grounding to connect images with meaning." }
    - { label: "Topics 6–7", start: 6, end: 7, title: "Visual generation", text: "Move from understanding visual content to generating it." }
    - { label: "Topics 8–9", start: 8, end: 9, title: "Scaling and multimodal LLMs", text: "Study LLM scaling and bring language and vision together in multimodal LLMs." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Wednesdays", time: "22:00 – 23:00 KST" }
  location: { building: "Engineering Building 4", rooms: "Room 307" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
