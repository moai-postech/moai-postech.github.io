<header class="course-head">
  <div class="course-heading-row">
    <h1>Members</h1>
    {% if page.members_sheet %}{% include course/sheet-link.html url=page.members_sheet label="Members sheet" %}{% endif %}
  </div>
  <p class="course-meta">{{ page.title }}</p>
</header>
<section class="content-section study-full-list" aria-label="Member directory">
  <div class="study-full-list-heading"><button type="button" class="study-lock-button" id="lock-member-list" hidden>Lock</button></div>
  <form class="study-member-unlock" id="member-unlock-form">
    <p>Enter the study password to view member details.</p>
    <div class="study-unlock-fields"><label for="member-password">Password</label><input type="password" id="member-password" autocomplete="current-password" required aria-describedby="member-unlock-message"><button type="submit" aria-controls="member-full-list" aria-expanded="false">Unlock</button></div>
  </form>
  <p id="member-unlock-message" class="study-unlock-message" role="status" aria-live="polite"></p>
  <div id="member-full-list" hidden></div>
  <noscript><p>Enable JavaScript to unlock the member list.</p></noscript>
</section>
<script type="application/json" id="member-encrypted-data">{{ site.data.ai_study_members_private | jsonify }}</script>
<script src="assets/study-members.js" defer></script>
