project:
  intro: false
  summary: Choose a data science task, establish a reproducible baseline, and compare a checked improvement. Explain
    AI assistance and its verification.
  team_size: Up to 4 students
  steps:
  - name: Baseline
    when: During the Semester
    text: Define the task and split, establish a reproducible baseline, and record the AI assistance used.
  - name: Final Presentation
    when: End of the Semester
    text: Explain the method, evaluate on held-out data, and share the code and experiment record.
    presentation: 15 min (incl. Q&A)
  evaluation:
    team_label: Team Evaluation
    team_reviewers: Instructor + other teams
    individual_label: Individual
    individual_reviewers: Teammates
  criteria:
  - name: Problem
    text: Significance and definition of the task
  - name: Method
    text: Reasoning, originality, and reproducibility
  - name: Results
    text: Valid comparisons and analysis of failures
  - name: Teamwork
    individual: true
    text: Contribution and shared responsibilities
  - name: Presentation
    text: Clear evidence and delivery
  rounds:
  - id: final
    name: Final
    date_placeholder: Date TBD
