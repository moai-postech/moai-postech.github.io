# 팀 프로젝트 페이지. 26S 프로젝트 시트에서 옮겼다(발표 한 번, Kaggle 등 대회 링크).
project:
  summary: >-
    Each team chooses a Kaggle competition, solves it together, and shares the experience in a final presentation.
  team_size: "up to 4 students"
  steps:
    - name: "Choose · Solve"
      when: "During the semester"
      text: "Pick a competition you care about and work on it as a team."
    - name: "Presentation · 60%"
      when: "May 28 & Jun 2"
      text: "Share the problem, your approach, and what you learned."
  criteria:
    - name: "Problem"
      text: "Why is this problem significant?"
    - name: "Method"
      text: "Is the solution original or trivial?"
    - name: "Results"
      text: "Final performance and leaderboard ranking"
    - name: "Teamwork"
      text: "Each member's individual contribution"
    - name: "Presentation"
      text: "Quality of delivery and storytelling"
  rounds:
    - id: "final"
      name: "Presentation"
  teams:
