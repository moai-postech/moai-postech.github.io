# Research > Overview 의 분야. area 가 분야 이름, blurb 가 분야 한 줄 설명, topics 가 그 안의 주제 카드다.
# stage 는 Perception → Reasoning → Action 중 이 분야가 맡는 단계.
# 페이지는 단계를 앞에, 분야 이름을 그 아래에 둔다. 단계에 한 가지 구조(예: objects)를 붙이지 않는다. 주제 전체를 담지 못한다.
# 소개의 scalable priors 와 잇는다(교수 2026-10-26): blurb 는 그 단계의 큰 철학을 말한다. 카드의 논문은 그 철학의 작은 일부라 blurb 에 나열하지 않는다(교수 2026-10-27),
# summary 는 한 단어 "<종류> priors for ..." 꼴로 그 주제가 넣는 prior 를 이름 붙인다(Learning in the Wild 는 교수의 원래 표현 statistical prior).
# summary 의 for 뒤는 지금 논문보다 넓게, 그 주제의 지향을 쓴다(교수 2026-10-27). 앞으로 할 방향도 담아도 된다.
# icon 은 assets/img/icons/<icon>.png. 주제마다 summary(문장 하나, 대문자로 시작, 마침표)와 papers(약칭, venue, url).
# venue 는 `학회'연도` 꼴(AGENTS.md 표기 규칙). 교수의 논문은 시기와 무관하게 모두 MOAI Lab 논문이다. 랩 시작 전후로 나누지 않는다.
# papers 는 _data/publications.yml 과 같은 순서(최신이 위)로 둔다. 페이지는 이를 뒤집어 옛 논문부터 칩으로 보인다(교수 2026-10-26).
# 칩에 마우스를 올리면 전체 제목이 뜬다. 전체 제목은 publications.yml(정본)에서 url 로 찾는다. url 이 없는 논문은 match 에
# publications.yml 제목의 앞부분을 쓴다. 논문 url 이 없으면 칩이 링크 없이 보인다.
- area: "Vision & Multimodal"
  stage: "Perception"
  icon: vision
  blurb: "Perception should see the world behind the pixels: its objects, its structure, and the regularities that data only hints at."
  topics:
    - name: "Visual Structure"
      summary: "Structural priors for seeing how the world is put together."
      papers:
        - { short: "CAFT", venue: "NeurIPS'26", url: "https://arxiv.org/abs/2602.02977" }
        - { short: "SHED", venue: "TMLR'26", url: "https://www.arxiv.org/abs/2601.22529" }
        - { short: "CAST", venue: "ICLR'24", url: "https://arxiv.org/abs/2210.00314" }
        - { short: "DIGAN", venue: "ICLR'22", url: "https://arxiv.org/abs/2202.10571" }
        - { short: "OAMixer", venue: "CVPRW'22", url: "https://arxiv.org/abs/2212.06595" }
        - { short: "OACon", venue: "NeurIPS'21", url: "https://arxiv.org/abs/2108.00049" }
        - { short: "InstaGAN", venue: "ICLR'19", url: "https://arxiv.org/abs/1812.10889" }
    - name: "Learning in the Wild"
      summary: "Statistical priors for learning from an imperfect, open-ended world."
      papers:
        - { short: "T-PRH", venue: "arXiv'26", url: "https://arxiv.org/abs/2609.27252" }
        - { short: "ToMA", venue: "NeurIPS'26", url: "https://arxiv.org/abs/2604.26370" }
        - { short: "PDS", venue: "ICLR'26", url: "https://arxiv.org/abs/2602.19756" }
        - { short: "OAK", venue: "CVPR'25", url: "https://arxiv.org/abs/2512.16202" }
        - { short: "S-CLIP", venue: "NeurIPS'23", url: "https://arxiv.org/abs/2305.14095" }
        - { short: "RoPAWS", venue: "ICLR'23", url: "https://arxiv.org/abs/2302.14483" }
        - { short: "MASKER", venue: "AAAI'21", url: "https://arxiv.org/abs/2012.09392" }
        - { short: "CSI", venue: "NeurIPS'20", url: "https://arxiv.org/abs/2007.08176" }
    - name: "Reliable AI"
      summary: "Social priors for AI that people can trust, in what it sees and what it makes."
      papers:
        - { short: "StayFair", venue: "NeurIPS'26", url: "https://arxiv.org/abs/2605.28036" }
        - { short: "PRIS", venue: "CVPR'26", url: "https://arxiv.org/abs/2512.03534" }
        - { short: "B2T", venue: "CVPR'24", url: "https://arxiv.org/abs/2301.11104" }
        - { short: "FICS", venue: "TMLR'23", url: "https://arxiv.org/abs/2212.02090" }
        - { short: "FreezeD", venue: "CVPRW'20", url: "https://arxiv.org/abs/2002.10964" }
        - { short: "GOLD", venue: "NeurIPS'19", url: "https://arxiv.org/abs/1910.09170" }
- area: "Language & Reasoning"
  stage: "Reasoning"
  icon: language
  blurb: "Reasoning should rest on more than text: on evidence, abstraction, and relations."
  topics:
    - name: "Reasoning & Agents"
      summary: "Cognitive priors for minds that know what they know."
      papers:
        - { short: "LoC", venue: "arXiv'26", url: "https://arxiv.org/abs/2610.21318" }
        - { short: "TEG", venue: "arXiv'26", url: "https://arxiv.org/abs/2610.05060" }
        - { short: "I2A", venue: "WACV'27", match: "Instruct2Alert" }
        - { short: "Idis", venue: "EMNLP'26", url: "https://arxiv.org/abs/2511.21397" }
        - { short: "SuRe", venue: "ICLR'24", url: "https://arxiv.org/abs/2404.13081" }
    - name: "Efficient LLMs"
      summary: "Algorithmic priors for doing more with less."
      papers:
        - { short: "Simba", venue: "TMLR'25", url: "https://arxiv.org/abs/2505.20698" }
        - { short: "HOMER", venue: "ICLR'24", url: "https://arxiv.org/abs/2404.10308" }
        - { short: "LAMP", venue: "ICLR'21", url: "https://arxiv.org/abs/2010.07611" }
        - { short: "LAP", venue: "ICLR'20", url: "https://arxiv.org/abs/2002.04809" }
    - name: "Structured Data"
      summary: "Symbolic priors for knowledge that lives in rules and relations."
      papers:
        - { short: "PRISM", venue: "arXiv'26", match: "PRISM:" }
        - { short: "DPM-SNC", venue: "NeurIPS'23", url: "https://arxiv.org/abs/2302.10506" }
        - { short: "LoGe", venue: "ICMLW'21", url: "https://arxiv.org/abs/2107.10493" }
- area: "Robotics & Embodied AI"
  stage: "Action"
  icon: robotics
  blurb: "Action should start from people and the physical world: what each person wants, and what a body can sense."
  topics:
    - name: "VLA & World Models"
      summary: "Behavioral priors for robots that understand the people they serve."
      papers:
        - { short: "INDI", venue: "arXiv'26", url: "https://arxiv.org/abs/2608.23478" }
        - { short: "VAP", venue: "ICML'26", url: "https://arxiv.org/abs/2512.20014" }
    - name: "Multisensory Learning"
      summary: "Sensory priors for robots that touch, hear, and feel the world."
      papers:
        - { short: "EIT-NN2", venue: "T-RO'21", url: "https://ieeexplore.ieee.org/document/9376677" }
        - { short: "EIT-NN", venue: "IROS'19", url: "https://ieeexplore.ieee.org/document/8968532" }
