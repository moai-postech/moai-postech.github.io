<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none" stroke-linecap="round" stroke-linejoin="round" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <!-- weekly loop: read a paper, explain it to the group, try it in code -->
  <g stroke="#BAC4CF" stroke-width="4">
    <path d="M160 92C230 40 330 40 400 92"/>
    <path d="M470 168C470 240 420 290 344 312"/>
    <path d="M216 312C140 290 90 240 90 168"/>
  </g>
  <g fill="#A61955" stroke="none">
    <path d="M400 92l-16 -2 8 -12z"/>
    <path d="M344 312l12 -12 4 14z"/>
    <path d="M90 168l-8 14 16 0z"/>
    <circle cx="280" cy="53" r="5"/><circle cx="445" cy="250" r="5"/><circle cx="115" cy="250" r="5"/>
  </g>
  <!-- center -->
  <circle cx="280" cy="192" r="58" fill="#F6E4EC" stroke="#A61955" stroke-width="6"/>
  <circle cx="280" cy="192" r="78" stroke="#E2AFC4" stroke-width="3" stroke-dasharray="6 10"/>
  <text x="280" y="186" text-anchor="middle" font-size="22" font-weight="700" fill="#172b40" stroke="none" letter-spacing="-.5">AI Study</text>
  <text x="280" y="210" text-anchor="middle" font-size="14" fill="#596574" stroke="none">every week</text>
  <!-- read -->
  <g stroke="#3F4C5A" stroke-width="5">
    <rect x="44" y="52" width="96" height="96" rx="16" fill="#fff"/>
    <path d="M70 70h30l14 14v46H70z" fill="#ECEFF3" stroke-width="4"/>
    <path d="M100 70v14h14" stroke-width="4"/>
    <path d="M80 98h24M80 110h24M80 122h16" stroke="#BAC4CF" stroke-width="5"/>
  </g>
  <!-- explain -->
  <g stroke="#3F4C5A" stroke-width="5">
    <rect x="420" y="52" width="96" height="96" rx="16" fill="#fff"/>
    <rect x="440" y="70" width="56" height="40" rx="4" fill="#ECEFF3" stroke-width="4"/>
    <path d="M454 100v-8M468 100v-16M482 100v-22" stroke="#A61955" stroke-width="5"/>
    <path d="M468 110v14m-12 8l12-8 12 8" stroke-width="4"/>
  </g>
  <!-- code -->
  <g stroke="#3F4C5A" stroke-width="5">
    <rect x="232" y="276" width="96" height="96" rx="16" fill="#fff"/>
    <rect x="250" y="294" width="60" height="60" rx="6" fill="#ECEFF3" stroke-width="4"/>
    <path d="M250 308h60" stroke-width="4"/>
    <path d="M270 322l-8 9 8 9M290 322l8 9-8 9" stroke-width="4"/>
    <path d="M283 320l-6 22" stroke="#A61955" stroke-width="4"/>
  </g>
  <g font-size="14" fill="#596574" stroke="none" text-anchor="middle">
    <text x="92" y="170">Read papers</text>
    <text x="468" y="170">Explain ideas</text>
    <text x="280" y="394">Try in code</text>
  </g>
</svg>
