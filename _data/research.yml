# Research > Overview 의 분야. area 가 분야 이름, blurb 가 분야 한 줄 설명, topics 가 그 안의 주제 카드다.
# icon 은 assets/img/icons/<icon>.png. 주제마다 summary(문장 하나, 대문자로 시작, 마침표)와 papers(약칭, venue, url).
# venue 는 `학회'연도` 꼴(AGENTS.md 표기 규칙). 교수의 논문은 시기와 무관하게 모두 MOAI Lab 논문이다. 랩 시작 전후로 나누지 않는다.
# 논문 url 이 없으면 칩이 링크 없이 보인다. 2026-10-21 마크다운 한 줄 형식에서 목록으로 바꿨다.
- area: "Vision & Multimodal"
  icon: vision
  blurb: "How models see: understanding and generating images and video, even from imperfect data."
  topics:
    - name: "Visual Structure"
      summary: "Representing scenes as objects, parts, and motion."
      papers:
        - { short: "InstaGAN", venue: "ICLR'19", url: "https://arxiv.org/abs/1812.10889" }
        - { short: "OACon", venue: "NeurIPS'21", url: "https://arxiv.org/abs/2108.00049" }
        - { short: "OAMixer", venue: "CVPRW'22", url: "https://arxiv.org/abs/2212.06595" }
        - { short: "DIGAN", venue: "ICLR'22", url: "https://arxiv.org/abs/2202.10571" }
        - { short: "CAST", venue: "ICLR'24", url: "https://arxiv.org/abs/2210.00314" }
        - { short: "CAFT", venue: "NeurIPS'26", url: "https://arxiv.org/abs/2602.02977" }
        - { short: "SHED", venue: "TMLR'26", url: "https://www.arxiv.org/abs/2601.22529" }
    - name: "Learning in the Wild"
      summary: "Learning from limited, uncurated, or novel data."
      papers:
        - { short: "CSI", venue: "NeurIPS'20", url: "https://arxiv.org/abs/2007.08176" }
        - { short: "MASKER", venue: "AAAI'21", url: "https://arxiv.org/abs/2012.09392" }
        - { short: "RoPAWS", venue: "ICLR'23", url: "https://arxiv.org/abs/2302.14483" }
        - { short: "S-CLIP", venue: "NeurIPS'23", url: "https://arxiv.org/abs/2305.14095" }
        - { short: "OAK", venue: "CVPR'25", url: "https://arxiv.org/abs/2512.16202" }
        - { short: "ToMA", venue: "NeurIPS'26", url: "https://arxiv.org/abs/2604.26370" }
        - { short: "T-PRH", venue: "arXiv'26", url: "https://arxiv.org/abs/2609.27252" }
    - name: "Reliable Generation"
      summary: "Generating faithfully under bias, noise, and scarce data."
      papers:
        - { short: "GOLD", venue: "NeurIPS'19", url: "https://arxiv.org/abs/1910.09170" }
        - { short: "FreezeD", venue: "CVPRW'20", url: "https://arxiv.org/abs/2002.10964" }
        - { short: "FICS", venue: "TMLR'23", url: "https://arxiv.org/abs/2212.02090" }
        - { short: "StayFair", venue: "NeurIPS'26", url: "https://arxiv.org/abs/2605.28036" }
- area: "Language & Reasoning"
