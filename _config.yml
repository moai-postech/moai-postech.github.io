# 사이트 전체 설정. 콘텐츠는 _data/ 와 페이지 *.md, 모양은 _themes/<테마>/ 에 있다.

title: MOAI Lab
# 머리글 로고 아이콘(브라우저 탭 아이콘으로도 쓴다). 글자는 title 을 테마의 로고 글꼴로 쓴다
logo: assets/img/logo-mark.svg
footer: MOAI Lab, POSTECH

# 위쪽 메뉴. url 은 페이지 파일 이름(.md → .html). children 이 있으면 마우스를 올렸을 때 하위 메뉴가 뜬다
nav:
  - title: Home
    url: index.html
  - title: People
    children:
      - title: Faculty
        url: faculty.html
      - title: Students
        url: students.html
      - title: Mentees
        url: mentees.html
  - title: Research
    children:
      - title: Overview
        url: research.html
      - title: Seminar
        url: seminar.html
      - title: Funding
        url: funding.html
  - title: Publications
    children:
      - title: By Year
        url: publications.html
      - title: By Topic
        url: landscape.html
  - title: Teaching
    children:
      - title: Courses
        url: teaching.html
      - title: Talks
        url: talks.html
  - title: Contact
    url: contact.html

# 테마 선택. 테마를 바꾸려면 아래 두 줄의 "classic" 을 새 테마 폴더 이름으로 바꾼다.
layouts_dir: _themes/wide/layouts
includes_dir: _themes/wide/includes

markdown: kramdown
kramdown:
  input: GFM
  # 따옴표를 곡선 따옴표로 바꾸지 않는다(원문 그대로)
  smart_quotes: ["apos", "apos", "quot", "quot"]

exclude:
  - AGENTS.md
  - CLAUDE.md
  - GEMINI.md
  - README.md
  - changelog
  - discussions
  - tools
  - Gemfile
  - Gemfile.lock
  - vendor
