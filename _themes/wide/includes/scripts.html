{% include text-selection.html %}
<script>
// Tabs for [data-tabs]: the first tab is open; clicking or arrow keys switch panels.
document.querySelectorAll('[data-tabs]').forEach(function (box) {
  var tabs = Array.prototype.slice.call(box.querySelectorAll('[role="tab"]'));
  function show(tab) {
    tabs.forEach(function (t) {
      var on = t === tab;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { show(t); });
    t.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      var index = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : d ? (i + d + tabs.length) % tabs.length : -1;
      if (index >= 0) { e.preventDefault(); var n = tabs[index]; show(n); n.focus(); }
    });
  });
  show(tabs.filter(function (t) { return t.getAttribute('aria-selected') === 'true'; })[0] || tabs[0]);
});
// Talks dated after today read as upcoming (checked in the visitor's browser, so it never goes stale between builds).
(function () {
  var d = new Date(), today = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  document.querySelectorAll('tr[data-date]').forEach(function (r) { if (r.getAttribute('data-date') >= today) r.classList.add('is-upcoming'); });
})();
// Filters for [data-filter]: year tabs ([data-year] buttons) pick one year, buttons with data-show pick rows by data-kind within it.
// The year rows are only for pages without scripts; the tabs name the year, so they hide here. The kind counts follow the chosen year.
// Column widths are measured with every row shown and then fixed, so switching years or filters never moves a column.
document.querySelectorAll('[data-filter]').forEach(function (box) {
  var btns = Array.prototype.slice.call(box.querySelectorAll('[data-show]'));
  var years = Array.prototype.slice.call(box.querySelectorAll('[role="tab"][data-year]'));
  var rows = Array.prototype.slice.call(box.querySelectorAll('tbody tr'));
  var talks = rows.filter(function (r) { return r.hasAttribute('data-kind'); });
  var table = box.querySelector('table');
  var cols = Array.prototype.slice.call(box.querySelectorAll('col'));
  var year = years.length ? years.filter(function (b) { return b.getAttribute('aria-selected') === 'true'; })[0].getAttribute('data-year') : null;
  var kind = 'all', locked = false;
  function apply() {
    var head = null, any = false;
    rows.forEach(function (r) {
      if (!r.hasAttribute('data-kind')) { if (head) head.hidden = year !== null || !any; head = r; any = false; return; }
      r.hidden = (year !== null && r.getAttribute('data-year') !== year) || (kind !== 'all' && r.getAttribute('data-kind') !== kind);
      if (!r.hidden) any = true;
    });
    if (head) head.hidden = year !== null || !any;
    btns.forEach(function (b) {
      var k = b.getAttribute('data-show'), n = talks.filter(function (r) { return (year === null || r.getAttribute('data-year') === year) && (k === 'all' || r.getAttribute('data-kind') === k); }).length;
      b.querySelector('span').textContent = n;
    });
  }
  function lock() {
    table.classList.remove('is-locked');
    cols.forEach(function (c) { c.style.width = ''; });
    if (getComputedStyle(table).display !== 'table') return;  /* phones stack the cells; nothing to fix */
    var hidden = rows.filter(function (r) { return r.hidden; });
    hidden.forEach(function (r) { r.hidden = false; });
    var row = talks.filter(function (r) { return r.children.length === cols.length; })[0] || talks[0];  /* a row with every cell: rows without an affiliation span the title over it */
    var widths = Array.prototype.map.call(row.children, function (td) { return td.getBoundingClientRect().width; });
    hidden.forEach(function (r) { r.hidden = true; });
    cols.forEach(function (c, i) { if (i !== 1) c.style.width = widths[i] + 'px'; });  /* the title column takes the rest */
    table.classList.add('is-locked');
  }
  apply();
  lock();
  if (document.fonts) document.fonts.ready.then(lock);
  var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(lock, 150); });
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      kind = b.getAttribute('data-show');
      btns.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      apply();
    });
  });
  function pick(b) {
    year = b.getAttribute('data-year');
    years.forEach(function (x) { var on = x === b; x.setAttribute('aria-selected', on ? 'true' : 'false'); x.tabIndex = on ? 0 : -1; });
    apply();
  }
  years.forEach(function (b, i) {
    b.addEventListener('click', function () { pick(b); });
    b.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      var index = e.key === 'Home' ? 0 : e.key === 'End' ? years.length - 1 : d ? (i + d + years.length) % years.length : -1;
      if (index >= 0) { e.preventDefault(); pick(years[index]); years[index].focus(); }
    });
  });
});
</script>
<script>
// Home Paper Stella band: the band keeps the clicks for its own link, so it tells the embedded map where
// the pointer is. The map uses this to open a short TL;DR beside the name under the pointer.
document.querySelectorAll('.has-mini').forEach(function (band) {
  var frame = band.querySelector('.mini-preview iframe');
  if (!frame) return;
  function send(e) {
    if (!frame.contentWindow) return;
    var r = frame.getBoundingClientRect();
    frame.contentWindow.postMessage(e
      ? { type: 'stella-mini-pointer', x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }
      : { type: 'stella-mini-pointer', x: null, y: null }, '*');
  }
  band.addEventListener('pointermove', send);
  band.addEventListener('pointerleave', function () { send(null); });
  // The band shows its own still poster until the map inside says it is drawing.
  window.addEventListener('message', function (e) {
    if (e.source === frame.contentWindow && e.data && e.data.type === 'stella-mini-ready') {
      frame.closest('.mini-preview').classList.add('is-ready');
    }
  });
});
</script>
