{% assign p = include.person %}<li class="person">{% if p.url %}<a class="person-name" href="{{ p.url }}">{{ p.name }}</a>{% else %}<span class="person-name">{{ p.name }}</span>{% endif %}
        {% if p.topic %}<span class="person-topic">{{ p.topic }}</span>{% endif %}
        {% if p.degree %}<span class="person-degree">{{ p.degree }}</span>{% endif %}
        {% if p.detail %}<span class="role">{% include inline.html text=p.detail %}</span>{% endif %}</li>
