# 랩 세미나 구글시트와 Drive 슬라이드 폴더를 읽어 Seminar 페이지(_data/seminar.yml, assets/seminar/)를 갱신한다.
# 매일 06:00 KST 에 돌고, Actions 탭에서 "Run workflow" 로 바로 돌릴 수도 있다. 비밀값은 쓰지 않는다(시트와 폴더가 링크 공개).
# 바뀐 것이 있으면 changelog/{날짜}-seminar-sync.md 에 기록하고 main 에 push 한 뒤 format 을 불러 배포한다. 절차는 tools/seminar_sync.py 머리말.
name: seminar-sync
on:
  schedule:
    - cron: "0 21 * * 0-6"  # cron 은 sangwoomo 가 마지막으로 고친다. 예약 실행의 실패 알림이 그 계정 설정(메일 끔)을 따른다(2026-11-02)
  workflow_dispatch:
permissions:
  contents: write
  actions: write  # 아래 format 실행용
concurrency:
  group: seminar-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      # pptx 로 올린 슬라이드를 PDF 로 바꿀 때만 쓴다. 한글 슬라이드가 있어 CJK 글꼴도 넣는다
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-impress fonts-noto-cjk
      - run: python3 tools/seminar_sync.py --changelog
      - name: commit and push
        id: push
        run: |
          paths="_data/seminar.yml assets/seminar changelog"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 다른 push 와 겹쳐 changelog/index.md 등이 충돌하면 최신 main 에서 동기화를 다시 돌린다(2026-11-03, 충돌로 실패 메일이 감)
          for i in 1 2 3; do
            if [ -z "$(git status --porcelain -- $paths)" ]; then echo "바뀐 것 없음"; exit 0; fi
            git add $paths
            git commit -q -m "Seminar: sync from the lab seminar sheet"
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::warning title=동기화 재시도::main 과 겹쳐 최신 main 에서 다시 동기화한다 ($i/3)"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main && git clean -fdq -- $paths
            python3 tools/seminar_sync.py --changelog
          done
          exit 1
      # GITHUB_TOKEN 으로 한 push 는 다른 워크플로를 깨우지 않아 format(빌드·배포)이 돌지 않는다. 바뀐 것이 있거나 손으로 돌렸을 때 직접 부른다
      - name: deploy
        if: steps.push.outputs.pushed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run format.yml --ref main --repo "$GITHUB_REPOSITORY"
