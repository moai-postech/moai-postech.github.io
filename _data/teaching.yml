# Teaching 의 Courses(POSTECH 정규 강의만). 위가 최신이다. code 는 학수번호(크로스리스팅 포함, 과목 이름 아래 회색 줄).
# terms 는 개설 학기(최신이 앞)와 그 학기의 강의 페이지(url, teaching/<id>/).
# 과목 이름은 최신 학기(terms 의 첫째) 강의 페이지로, 오른쪽 학기는 각 학기 페이지로 이어진다(2026-10-27 교수).
- title: "Data Engineering"
  code: "IMEN891K / IDSC501 / AXGS-501"
  terms:
    - name: "Fall 2026"
      url: "teaching/26f-data-engineering/"
    - name: "Fall 2025"
      url: "teaching/25f-data-engineering/"
- title: "Programming for Data Science"
  code: "IMEN574 / IDSC574"
  terms:
    - name: "Spring 2026"
      url: "teaching/26s-programming-for-data-science/"
