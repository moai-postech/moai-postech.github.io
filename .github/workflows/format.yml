# 평소 push 는 빌드 뒤 바로 배포한다(AGENTS.md "검사와 배포"). 빠른 검사는 배포와 나란히 돌고 배포를 기다리게 하지 않는다.
# 전수 검사는 요청할 때만 audit.yml 로 돌린다.
name: format
on:
  push:
    branches: [main]
    paths-ignore: ["changelog/**", "discussions/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
jobs:
  format:  # 빌드. 기존 검사 이름 유지
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: format
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  checks:  # 배포와 나란히 돈다. 실패하면 TODO.md 에 남기고 알린다(AGENTS.md "검사와 배포")
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - name: Quick checks  # 하나가 실패해도 넷 다 돌리고, 실패한 것을 요약에 모은다
        run: |
          fail=0
          for t in test_design check_postech check_selection check_study_members; do
            if node "tools/$t.js" > "$t.log" 2>&1; then
              echo "$t: 통과"
            else
              fail=1
              echo "::error title=$t 실패::$(tail -n 3 "$t.log" | tr '\n' ' ')"
              echo "- \`$t\` 실패: $(tail -n 1 "$t.log")" >> "$GITHUB_STEP_SUMMARY"
              tail -n 30 "$t.log"
            fi
          done
          exit $fail
