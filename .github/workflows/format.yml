# 사이트 전체 형식 검사(AGENTS.md "형식은 전역 규칙으로")와 POSTECH 필수 요소 검사(POSTECH.md). 사이트를 빌드해 모든 페이지를 잰다.
name: format
on:
  push:
    branches: [main]
    paths-ignore: ["changelog/**", "discussions/**"]
  pull_request:  # PR 에서는 늘 돈다. 브랜치 보호가 이 검사를 필수로 요구하므로 건너뛰면 merge 가 막힌다
  workflow_dispatch:
jobs:
  format:  # 브랜치 보호의 필수 검사 이름(tools/setup_main_ruleset.sh)
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node tools/test_design.js
      - run: node tools/check_design.js --report design-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-audit
          path: design-audit.json
      - run: node tools/check_format.js
      - run: node tools/check_typography.js
      - run: node tools/check_selection.js
      - run: node tools/check_interaction.js
      - run: node tools/check_study_members.js
      - run: node tools/check_postech.js
