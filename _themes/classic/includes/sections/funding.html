    <section class="content-section">
    <h2>{{ include.section.title }}</h2>
    <div class="section-body">
    {% for g in site.data.funding %}
    <h3 class="sub">{{ g.group }}</h3>
    <ul class="plain funding">
      {% for f in g.projects %}<li><strong>{{ f.sponsor }}</strong><span lang="ko">{{ f.title }}</span><time>{{ f.years }}</time></li>
      {% endfor %}
    </ul>
    {% endfor %}
    </div>
    </section>
