# 팀 프로젝트 페이지(teaching/<id>/project/). 학생은 sheet 에 입력하고, 교수가 teams 로 옮긴다(시트 → 이 파일).
# 팀원은 시트 순서(첫 사람이 팀장). 발표 회차(rounds)마다 date(발표일), order(그날 순서), slides(발표 자료).
project:
  sheet: "https://docs.google.com/spreadsheets/d/1SjOnpmdC4ZQcAQffTwqP2GWTv55ujObgNl_frRshPyk/edit?usp=sharing"
  summary: >-
    Teams go through an end-to-end data engineering pipeline: they collect and prepare data, store it in a database,
    and build a product that addresses a real-world problem on it. Any data source is fine if you are allowed to use it.
  team_size: "up to 5 students"
  steps:
    - name: "Proposal · 20%"
      when: "Oct 20 & 22"
      text: "Ideation, data collection and preprocessing, and database management."
    - name: "Final · 40%"
      when: "Dec 15 & 17"
      text: "A product that addresses a real-world problem using a large-scale database, possibly with an LLM."
  criteria:
    - name: "Novelty"
      text: "Originality and creativity of the idea"
    - name: "Impact"
      text: "Relevance and potential usefulness of the solution"
    - name: "Technology"
      text: "Effective use of the techniques and tools covered in class"
    - name: "Presentation"
      text: "Clarity and professionalism of the report and presentation"
  rounds:
    - id: "proposal"
      name: "Proposal"
    - id: "final"
      name: "Final"
