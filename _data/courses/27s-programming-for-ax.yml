# 2027 curriculum: lecture order is fixed; dates and logistics are unconfirmed.
title: Programming for AX
code: IMEN574 / IDSC574
term: Spring 2027
instructor:
  name: Sangwoo Mo
  url: faculty.html
summary: Learn to program for AI transformation by using AI first, then reading, debugging, and evaluating the code
  and models it produces. The course connects Python and classical machine learning to deep learning, foundation
  models, and coding agents. Lecture dates and logistics will be announced before the semester.
parts:
- id: sw3
  name: Software 3.0
  title: Programming with AI
  span: Lectures 2–4
  text: 'Complete the AI workflow first: request work, build and check code in an IDE, and direct coding agents
    with connected tools.'
- id: sw1
  name: Software 1.0
  title: Python and Classical Machine Learning
  span: Lectures 5–13
  text: Read generated code, handle arrays and DataFrames, validate data, then choose and evaluate regression, classification,
    ensembles, clustering, representations, and explanations.
- id: sw2
  name: Software 2.0
  title: Deep Learning and Foundation Models
  span: Lectures 14–22
  text: Train small networks, use visual and language representations, and build checked AI workflows.
