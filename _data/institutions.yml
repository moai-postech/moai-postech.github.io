# 기관 공식 영문 사이트. Seminar 페이지의 소속(affiliation) 글자와 Funding 의 기관명(funding.yml sponsor)이 여기서 같은 이름을 찾아 링크한다.
# 키는 _data/funding.yml 의 sponsor, _data/talks.yml 의 venues(글자 그대로 쓴 기관), _data/seminar.yml(시트 affiliation_en)·_data/ime_seminar.yml 의 affiliation 과 글자 그대로 같아야 한다.
# 기관명 그대로의 공식 첫 화면으로 건다(과제 내용에 맞춰 사업부·계열사 사이트로 바꾸지 않는다, 교수 2026-11-17). 영문판이 따로 있으면 영문판 주소를 쓴다. 더하거나 바꾸면 브라우저로 직접 열어 영문 첫 화면이 뜨는지 본다(교수 2026-11-10). 새 소속이 생기면 한 줄 더한다. 없는 소속은 링크 없이 글자만 나온다.
