    <section class="content-section">
    <h2>{{ include.section.title }}</h2>
    <div class="section-body">
    <ul class="plain item-list">
      {% for c in site.data.teaching %}<li>
        <span class="item-main"><strong>{% if c.url %}<a href="{{ c.url }}">{{ c.title }}</a>{% else %}{{ c.title }}{% endif %}</strong>{% if c.code %}<span class="item-sub">{{ c.code }}, {{ c.institution }}</span>{% endif %}</span>
        <span class="item-side">{{ c.terms | join: " · " }}</span>
      </li>
      {% endfor %}
    </ul>
    </div>
    </section>
