<script>
// Tabs for [data-tabs]: the first tab is open; clicking or arrow keys switch panels.
document.querySelectorAll('[data-tabs]').forEach(function (box) {
  var tabs = Array.prototype.slice.call(box.querySelectorAll('[role="tab"]'));
  function show(tab) {
    tabs.forEach(function (t) {
      var on = t === tab;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { show(t); });
    t.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (d) { var n = tabs[(i + d + tabs.length) % tabs.length]; show(n); n.focus(); }
    });
  });
  show(tabs.filter(function (t) { return t.getAttribute('aria-selected') === 'true'; })[0] || tabs[0]);
});
// Filters for [data-filter]: buttons with data-show pick rows by data-kind; a year row hides when none of its talks show.
document.querySelectorAll('[data-filter]').forEach(function (box) {
  var btns = Array.prototype.slice.call(box.querySelectorAll('[data-show]'));
  var rows = Array.prototype.slice.call(box.querySelectorAll('tbody tr'));
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      var kind = b.getAttribute('data-show'), head = null, any = false;
      btns.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      rows.forEach(function (r) {
        if (!r.hasAttribute('data-kind')) { if (head) head.hidden = !any; head = r; any = false; return; }
        r.hidden = kind !== 'all' && r.getAttribute('data-kind') !== kind;
        if (!r.hidden) any = true;
      });
      if (head) head.hidden = !any;
    });
  });
});
</script>
