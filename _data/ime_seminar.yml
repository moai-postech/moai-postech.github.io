    speaker: "Songyee Yoon"
    url: "https://www.linkedin.com/in/songyee-yoon-principal-venture-partners"
    affiliation: "Principal Venture Partners"
  - date: "2026-05-29"
    kind: guest
    title: "Agentic AI 시대의 Personalization AI"
    speaker: "Yeong-Hwan Jeon"
