# 학기별 학습 흐름과 운영 정보. learning_path 의 start·end 는 그 단계에 속한 회차 번호로 Schedule 에서 단계에 마우스를 올리면 그 행을 강조한다. tldr 은 학기 주제를 한 문장으로 줄인 요약으로 Home 학기 카드와 Schedule 학기 탭이 함께 쓴다. tldr 은 learning_path 단계마다 구절 하나를 단계 순서대로 두고, 각 구절의 동사는 그 단계 제목의 첫 동사와 같게 쓴다. 단계 범위는 1회부터 마지막 정규 회차까지 빈틈·겹침 없이 잇고 선택 회차(A1 등)는 넣지 않는다. 검사: node tools/check_study_terms.js(교수 2026-11-02). icon 은 Home 학기 카드의 그림(학기 주제별 study-*.svg, Codex 제작 2026-11-02). 일정·자료는 ai_study.yml(시트 자동 동기화), 운영 정보는 이 파일에서 관리한다.
# 시간 근거와 장소 변경 결정은 changelog/2026-10-28-ai-study-materials.md에 있다.
# 장소 기본값: Fall 2026부터 공학4동 302호. 특별한 이슈가 없으면 새 학기도 302호를 사용한다(교수 2026-10-28).
fall-2026:
  tldr: "How robots learn to act in the real world, understand 3D scenes, and connect goals to actions."
  icon: "assets/img/icons/physical.svg"
  learning_path:
    - { start: 1, end: 6, title: "Learn to Act", text: "Demonstrations and interaction teach robots useful behaviors, from moving through a space to manipulating objects." }
    - { start: 7, end: 8, title: "Understand the Scene", text: "3D representations turn images into a spatial picture of the world, grounding those behaviors in the surrounding scene." }
    - { start: 9, end: 11, title: "Connect Goals to Actions", text: "Spatial reasoning, VLA, and world models connect goals and perception to actions and their predicted consequences." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Tuesdays", time: "21:00 – 22:00 KST" }
  location: { building: "Science Building 4", rooms: "Room 302" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
summer-2026:
  tldr: "How neural networks are built to learn, model data, and transfer and generalize to new tasks."
  icon: "assets/img/icons/study-deep-learning.svg"
  format: lectures
  reference_course: { title: "MIT 6.7960 Deep Learning", term: "Fall 2025", url: "https://deeplearning6-7960.github.io/2025/index.html" }
  learning_path:
    - { start: 1, end: 3, title: "Build the Learner", text: "Connect optimization with architectures for images and sequences: how the network is built and how its parameters learn." }
    - { start: 4, end: 7, title: "Model the Data", text: "Study how learning objectives produce useful representations, then use learned distributions to generate new data." }
    - { start: 8, end: 9, title: "Transfer and Generalize", text: "Ask why these models work on unseen data and how their learned representations can be reused for new tasks." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Usually Tuesdays", time: "15:30 – 16:30 KST" }
  location: { building: "Science Building 4", rooms: "Room 307" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
spring-2026:
  tldr: "How language models reason step by step, learn from feedback, and use tools to act as agents."
  icon: "assets/img/icons/study-llm.svg"
  learning_path:
    - { start: 1, end: 2, title: "Reason Step by Step", text: "Start with how an LLM produces answers and how step-by-step reasoning changes the way it solves a problem." }
    - { start: 3, end: 6, title: "Learn from Feedback", text: "Fine-tuning and feedback connect a pretrained model to instruction following, alignment, and more capable reasoning." }
    - { start: 7, end: 9, title: "Use Context and Tools", text: "Context, retrieval, and tools let the model work with external information and take steps toward a larger goal." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Tuesdays", time: "21:00 – 22:30 KST" }
  location: { building: "Science Building 4", rooms: "Room 307" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
fall-2025:
  tldr: "How models learn representations, connect vision and language, generate images, and scale up."
  icon: "assets/img/icons/study-foundation-models.svg"
  learning_path:
    - { start: 1, end: 3, title: "Learn Representations", text: "Neural networks and transformers turn raw data into representations that support visual perception." }
    - { start: 4, end: 5, title: "Connect Modalities", text: "Link vision and language so a model can interpret images and ground the meaning of words in what it sees." }
    - { start: 6, end: 7, title: "Generate Visual Content", text: "Move from recognizing visual patterns to modeling how new images and videos can be generated from data." }
    - { start: 8, end: 9, title: "Scale the Model", text: "Study how scaling and multimodal LLMs extend language models with broader knowledge and vision." }
  advisor: { name: "Prof. Sangwoo Mo", url: "faculty.html", affiliation: "POSTECH IME", photo: "assets/img/people/sangwoo-mo.jpg" }
  meetings: { day: "Wednesdays", time: "22:00 – 23:00 KST" }
  location: { building: "Science Building 4", rooms: "Room 307" }
  representative: { name: "Jian Choi", photo: "assets/img/people/jian-choi.jpg", email: "chjohn1105 [at] postech.ac.kr" }
