# Seminar 페이지의 발표 목록. 위가 최신이다. 정본은 랩 세미나 구글시트(sheet 의 주소, 링크 공개).
# invited: true 는 외부 초청 연사(affiliation, url=연사 홈페이지). 나머지는 랩 내부 발표(논문 리뷰, 자기 연구).
# 외부 연사 발표 자료는 공개하지 않는다(교수 원칙). 내부 발표는 slides 에 랩 세미나 Drive 폴더의 파일 주소를 두면 제목이 그 파일로 링크된다(폴더가 링크 공개).
# 발표 자료가 없으면 paper 에 연사의 해당 논문(arXiv 초록 주소)을 둔다. 링크는 제목에만 걸리고 slides 가 우선이다. 여러 논문을 묶은 발표면 대표 하나(연사가 1저자인 최근 논문). 둘 다 없으면 제목은 링크 없이 둔다(교수 2026-10-26).
# 연사 이름은 모두 링크한다: 초청 연사와 인턴은 url(홈페이지, 없으면 본인이 공개한 블로그나 GitHub), 랩 멤버는 People 의 그 사람 자리(템플릿이 자동). 인턴은 People 에 올리지 않는다(교수 2026-10-26).
# 영문 이름은 _data/members.yml, 연사 홈페이지, Slack 프로필, 본인 메일 표시 이름을 따른다.
# 시험, 마감, monthly sync 처럼 발표가 아닌 행과 공개 전 연구 코드명(10/07 jev)은 넣지 않는다.
