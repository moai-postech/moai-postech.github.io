# 평소 push 는 빌드 뒤 바로 배포한다(AGENTS.md "검사와 배포"). 빠른 검사는 배포와 나란히 돌고 배포를 기다리게 하지 않는다.
# 전수 검사는 요청할 때만 audit.yml 로 돌린다.
name: format
on:
  push:
    branches: [main]
    paths-ignore: ["changelog/**", "discussions/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
jobs:
  format:  # 빌드. 기존 검사 이름 유지
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      built: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Who pushed  # 교수 계정의 push 면 빌드 실패도 실패로 끝내지 않는다(AGENTS.md 검사와 배포, 2026-11-03)
        id: who
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && grep -v '^#' tools/maintainers.txt | tr ' ' '\n' | grep -qx "$GITHUB_ACTOR"; then
            echo "warn_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "warn_only=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        id: build
        continue-on-error: ${{ steps.who.outputs.warn_only == 'true' }}  # 빌드가 깨지면 배포하지 않고 이전 사이트를 그대로 둔다. 실패는 주석으로 본다
        run: bundle exec jekyll build
      - if: steps.build.outcome == 'failure'
        run: echo "::warning title=빌드 실패, 배포하지 않음::로그의 Build 단계를 보고 고친 뒤 다시 push 한다(AGENTS.md 검사와 배포)"
      - name: Record published version
        if: steps.build.outcome == 'success'
        run: python3 tools/published_version.py write _site
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.build.outcome == 'success'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.format.outputs.built == 'success'
    needs: format
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
      - name: Retry a stalled deployment using the existing artifact
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
      - name: Verify the public version
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          expected = os.environ['EXPECTED_SHA']
          url = 'https://moai.postech.ac.kr/deployment.json'
          for attempt in range(12):
              try:
                  request = urllib.request.Request(url + '?v=' + expected, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      manifest = json.load(response)
                  if manifest.get('commit') == expected:
                      for path, digest in manifest['files'].items():
                          request = urllib.request.Request('https://moai.postech.ac.kr/' + path + '?v=' + expected, headers={'Cache-Control': 'no-cache'})
                          with urllib.request.urlopen(request, timeout=15) as response:
                              actual = hashlib.sha256(response.read()).hexdigest()
                          if actual != digest:
                              raise ValueError('Stale public file: ' + path)
                      print('Public commit and course file hashes verified:', expected)
                      break
              except Exception as error:
                  print(type(error).__name__)
              time.sleep(5)
          else:
              raise SystemExit('Pages reported success, but the public version is still stale')
          PY
  checks:  # 배포와 나란히 돈다. 실패하면 TODO.md 에 남기고 알린다(AGENTS.md "검사와 배포")
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        id: build
        continue-on-error: true  # 빌드 실패는 format 이 알린다. 여기서는 검사만 건너뛴다
        run: bundle exec jekyll build
      - uses: actions/setup-node@v4
        if: steps.build.outcome == 'success'
        with:
          node-version: "22"
      - if: steps.build.outcome == 'success'
        run: npm install --no-save --no-package-lock playwright@1.48.2
      - if: steps.build.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - name: Quick checks  # 하나가 실패해도 모두 돌리고, 실패한 것을 요약과 주석에 모은다. 실행은 실패로 표시하지 않는다(교수에게 실패 메일이 가지 않게, 2026-11-02)
        if: steps.build.outcome == 'success'
        run: |
          fail=0
          for t in test_design check_postech check_selection check_study_members check_guest_titles check_study_terms check_link_arrows; do
            if node "tools/$t.js" > "$t.log" 2>&1; then
              echo "$t: 통과"
            else
              fail=1
              echo "::error title=$t 실패::$(tail -n 3 "$t.log" | tr '\n' ' ')"
              echo "- \`$t\` 실패: $(tail -n 1 "$t.log")" >> "$GITHUB_STEP_SUMMARY"
              tail -n 30 "$t.log"
            fi
          done
          if [ "$fail" -ne 0 ]; then echo "::warning title=빠른 검사 실패::실행 요약을 보고 고친다(AGENTS.md 검사와 배포)"; fi
