# 팀 프로젝트 페이지. 25F 프로젝트 시트에는 팀원 이름이 없고 발표일 구분 없이 순서만 있다. 3팀 proposal 자료는 없다.
project:
  sheet: "https://docs.google.com/spreadsheets/d/1XLgh0ILJ1VUgljXeaelXuAXfN5RmUB6fVRsMW6CKGKk/edit?usp=sharing"
  summary: >-
    Teams go through an end-to-end data engineering pipeline: they collect and prepare data, store it in a database,
    and build a product that addresses a real-world problem on it.
  team_size: "3 to 5 students"
  team_formation:
    deadline: "2025-09-21"
    rule: "Sunday of Week 3"
    text: "Enter your team members in the project sheet."
  steps:
    - name: "Proposal"
      when: "Oct 14 & 16"
      text: "Ideation, data collection and preprocessing, and database management."
    - name: "Final"
      when: "Dec 9 & 11"
      text: "A product that addresses a real-world problem using a large-scale database, possibly with an LLM."
  evaluation:
    team_label: "Team evaluation"
    team_reviewers: "Instructor + other teams"
    individual_label: "Individual"
    individual_reviewers: "Teammates"
  criteria:
    - name: "Novelty"
      text: "Originality and creativity of the idea"
    - name: "Impact"
      text: "Relevance and potential usefulness of the solution"
    - name: "Technology"
      text: "Effective use of the techniques and tools covered in class"
    - name: "Teamwork"
      individual: true
      text: "Contribution to technical work, collaboration and shared responsibilities"
    - name: "Presentation"
      text: "Clarity and professionalism of the report and presentation"
  rounds:
    - id: "proposal"
      name: "Proposal"
    - id: "final"
      name: "Final"
  teams:
    - n: 1
      title: "개인 맞춤 논문 요약 메일링"
      proposal:
        order: 1
        slides: "teaching/25f-data-engineering/project/proposal/proposal_team01.pdf"
      final:
        order: 8
        slides: "teaching/25f-data-engineering/project/final/final_team01.pdf"
    - n: 2
      title: "소비자를 위한 리콜 상품 알리미"
      proposal:
        order: 8
        slides: "teaching/25f-data-engineering/project/proposal/proposal_team02.pdf"
      final:
        order: 3
        slides: "teaching/25f-data-engineering/project/final/final_team02.pdf"
    - n: 3
      title: "Finflow Engineering (금융 파이프라인 구축 프로젝트)"
      proposal:
        order: 5
      final:
        order: 4
        slides: "teaching/25f-data-engineering/project/final/final_team03.pdf"
    - n: 4
      title: "온톨로지 기반의 맞춤형 아트 큐레이션 시스템"
      proposal:
        order: 2
        slides: "teaching/25f-data-engineering/project/proposal/proposal_team04.pdf"
      final:
        order: 9
        slides: "teaching/25f-data-engineering/project/final/final_team04.pdf"
