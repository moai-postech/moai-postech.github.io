    <section class="content-section">
    <h2>{{ include.section.title }}</h2>
    <div class="section-body">
    {% for y in site.data.talks %}
    <h3 class="sub">{{ y.year }}</h3>
    <div class="cards cards-3 talk-cards">
      {% for t in y.talks %}<div class="card talk-card">
        <h3>{{ t.title }}</h3>
        <p class="talk-venues">{% for v in t.venues %}<span>{{ v }}</span>{% endfor %}</p>
      </div>
      {% endfor %}
    </div>
    {% endfor %}
    {% if include.section.more %}<p class="more">{% include inline.html text=include.section.more %}</p>{% endif %}
    </div>
    </section>
