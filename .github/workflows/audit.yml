# 사이트 전수 검사(AGENTS.md "검사와 배포"). 교수가 요청할 때만 Actions 에서 수동으로 돌린다. 배포를 막지 않는다.
name: audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - name: Build, run every check and capture every screen
        id: audit
        continue-on-error: true  # 실패는 주석과 artifact 로 본다. 실행을 실패로 끝내면 교수에게 실패 메일이 간다(AGENTS.md 검사와 배포)
        run: node tools/visual_review.js prepare --out visual-review-bundle --implementer full-audit
      - if: steps.audit.outcome == 'failure'
        run: echo "::warning title=전수 검사 실패::artifact 의 logs 와 갤러리를 본다"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-audit-${{ github.run_id }}
          path: visual-review-bundle/
          retention-days: 14
