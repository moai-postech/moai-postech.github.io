{% comment %}
  Schedule 과 Term Project 페이지의 머리. include.heading(페이지 이름)을 제목으로 쓰고 과목명·학수번호·학기는 아래 한 줄로.
  Home 의 머리는 운영 정보 칸이 붙은 큰 머리라 home.html 이 따로 그린다.
{% endcomment %}
{% assign c = site.data.courses[page.course] %}
    <header class="course-head">
      <h1>{{ include.heading }}</h1>
      <p class="course-meta"><span>{{ c.title }}</span><span>{{ c.code }}</span><span>{{ c.term }}</span><span>POSTECH</span></p>
    </header>
